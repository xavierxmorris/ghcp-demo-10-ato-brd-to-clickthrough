name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Both BRD versions / real Edge acceptance suite
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove historical results before generating fresh evidence
        shell: pwsh
        run: Remove-Item -LiteralPath 'testing\test-pack\results.json', 'testing\test-pack\results.js'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:contract
      - id: verify
        run: npm run verify
      - name: Require the complete two-version acceptance baseline
        shell: pwsh
        run: |
          $result = Get-Content -LiteralPath 'testing\test-pack\results.json' -Raw | ConvertFrom-Json
          if (-not $result.summary.green -or $result.summary.total -ne 102 -or $result.summary.passed -ne 102) {
            throw 'Expected all 102 acceptance checks to execute and pass'
          }
          foreach ($entry in @{ 'v1.0' = 43; 'v1.1' = 59 }.GetEnumerator()) {
            $cases = @($result.versions.($entry.Key).PSObject.Properties | Where-Object { $_.Name -like 'TC-*' })
            if ($cases.Count -ne $entry.Value) { throw "Incomplete acceptance coverage for $($entry.Key)" }
          }
      - name: Upload only fresh browser results
        if: ${{ !cancelled() && (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-results
          path: |
            testing/test-pack/results.json
            testing/test-pack/results.js
          if-no-files-found: error
          retention-days: 7
